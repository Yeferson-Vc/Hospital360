<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hospital 360 | Design Thinking</title><style>
*{box-sizing:border-box}body{margin:0;background:#071827;color:#eaf5ff;font:16px system-ui}header{padding:22px 5%;background:#10283c;display:flex;justify-content:space-between;align-items:center}h1,h2,h3{margin:0 0 12px}small,p{color:#a9c4d5;line-height:1.6}main{max-width:1150px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button{font:inherit;cursor:pointer;border:1px solid #38647d;border-radius:10px;padding:12px 16px;background:#15364b;color:#eaf5ff}button:hover{background:#22536a}button.active,.primary{background:#087f83;border-color:#49e0ce;color:white}button:disabled{opacity:.35;cursor:not-allowed}.layout{display:grid;grid-template-columns:2fr 1fr;gap:18px}.panel{background:#10283c;border:1px solid #25465d;border-radius:17px;padding:23px;margin-bottom:15px}.scene{height:190px;background:linear-gradient(155deg,#24556c,#10283c);border-radius:12px;display:flex;align-items:center;justify-content:space-around;overflow:hidden;border-bottom:8px solid #3c7686}.person{text-align:center;font-size:55px;animation:float 3s ease-in-out infinite}.person small{display:block;font-size:13px;color:white}@keyframes float{50%{transform:translateY(-5px)}}.choices{display:grid;gap:9px}.choices button{text-align:left}.selected{border:2px solid #49e0ce;background:#164f59} .meter{height:8px;background:#25465d;border-radius:8px;overflow:hidden;margin:8px 0 17px}.meter i{display:block;height:100%;background:#49e0ce;transition:width .4s}.tag{color:#59e1cf;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.feedback{border-left:3px solid #49e0ce;padding:10px 15px;background:#15364b;margin:10px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.phone{background:#e9f4f7;color:#123445;border:7px solid #38596a;border-radius:24px;padding:16px;max-width:290px;margin:12px auto}.phone p{color:#123445;background:white;padding:10px;border-radius:8px}.muted{color:#a9c4d5}textarea{width:100%;background:#071827;color:white;border:1px solid #38647d;border-radius:8px;padding:12px;font:inherit} @media(max-width:720px){.layout{grid-template-columns:1fr}header{display:block}.person{font-size:40px}} </style><header><div><div class="tag">Laboratorio de innovación · Simulación</div><h1>HOSPITAL 360</h1></div><div id="round"></div></header><main><nav id="nav"></nav><div class="layout"><section id="game" class="panel"></section><aside><div class="panel" id="stats"></div><div class="panel"><h3>Bitácora del equipo</h3><div id="log"></div></div><button onclick="reset()">Reiniciar partida</button></aside></div></main><script>
const stages=['Empatizar','Definir','Idear','Prototipar','Testear'];const people=[['👵','Rosa · paciente mayor','No escuché mi nombre. No tengo celular inteligente y temo perder mi turno.'],['👨‍🦽','Luis · paciente','No sé cuánto falta ni a qué consultorio debo ir. Necesito señalización accesible.'],['👩‍⚕️','Ana · enfermera','Las interrupciones para preguntar por turnos retrasan nuestro trabajo.'],['👨‍💼','Marco · admisión','La red falla a veces. No podemos reemplazar el sistema actual sin autorización.']];const problems=['Los pacientes necesitan conocer su turno y ubicación mediante canales accesibles y confiables.','El hospital necesita comprar pantallas más grandes.','Los pacientes deben llegar más temprano.'];const ideas=[['Panel visual y llamado audible',35],['Orientador presencial y señalización',25],['Consulta de turno por celular',30],['Modo sin conexión y sincronización',25],['Capacitación y prueba con personal',15],['Reconocimiento facial obligatorio',60]];let s;function reset(){s={step:0,round:1,seen:[],problem:-1,ideas:[],features:[],note:'',history:[],log:[],tested:false};render()}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function log(x){s.log.unshift(x)}function move(n){s.step=n;s.tested=false;render()}function interview(i){if(!s.seen.includes(i)){s.seen.push(i);log('Entrevista: '+people[i][1])}render()}function choose(i){s.problem=i;log('Problema reformulado');render()}function toggle(k,i){let a=s[k];if(a.includes(i))a.splice(a.indexOf(i),1);else a.push(i);if(k==='ideas')s.features=s.features.filter(x=>a.includes(x));render()}function cost(){return s.ideas.reduce((a,i)=>a+ideas[i][1],0)}function metrics(){let f=s.features, good=s.problem===0;return [Math.round(s.seen.length/4*100),good?100:s.problem<0?0:30,Math.min(100,s.ideas.length*25),Math.min(100,(f.includes(0)?35:0)+(f.includes(1)?25:0)+(f.includes(2)?5:0)+(f.includes(3)?20:0)+(f.includes(4)?15:0)),cost()<=100?100:0]}function test(){let m=metrics(), score=Math.round(m.reduce((a,b)=>a+b,0)/5);s.history.push({round:s.round,score,access:m[3],cost:cost()});s.tested=true;log('Prueba '+s.round+': '+score+'/100');render()}function iterate(n){s.round++;log('Iteración '+s.round+' → '+stages[n]);move(n)}function btn(t,fn,cls='',disabled=false){return `<button class="${cls}" onclick="${fn}" ${disabled?'disabled':''}>${t}</button>`}function render(){document.getElementById('round').innerHTML='Ciclo '+s.round+' · Presupuesto: 100 créditos';document.getElementById('nav').innerHTML=stages.map((x,i)=>btn((i+1)+' · '+x,`move(${i})`,s.step===i?'active':'',i>s.step)).join('');let h=`<div class="tag">Misión ${s.step+1} de 5</div><h2>${stages[s.step]}</h2>`;if(s.step===0){h+=`<p>Explora la sala de espera. Entrevista a los personajes para descubrir necesidades, no para confirmar tus suposiciones.</p><div class="scene">${people.map(p=>`<div class="person">${p[0]}<small>${p[1].split(' · ')[0]}</small></div>`).join('')}</div><div class="choices">${people.map((p,i)=>btn(p[1]+(s.seen.includes(i)?' ✓':''),`interview(${i})`)).join('')}</div>${s.seen.map(i=>`<div class="feedback"><b>${people[i][1]}</b><p>${people[i][2]}</p></div>`).join('')}<div class="actions">${btn('Definir el reto →','move(1)','primary',s.seen.length<2)}</div>`}if(s.step===1){h+=`<p>Elige una definición centrada en las necesidades descubiertas. Una solución específica todavía no es un problema.</p><div class="choices">${problems.map((p,i)=>btn(p,`choose(${i})`,s.problem===i?'selected':'')).join('')}</div>${s.problem>=0?`<div class="feedback">${s.problem===0?'Bien: el reto se centra en necesidades y admite varias soluciones.':'Revisa los testimonios: esta formulación anticipa una solución o responsabiliza al usuario.'}</div>`:''}<div class="actions">${btn('Generar ideas →','move(2)','primary',s.problem<0)}</div>`}if(s.step===2){h+=`<p>Selecciona al menos dos ideas. Tienes 100 créditos de innovación. Considera inclusión, viabilidad y privacidad.</p><div class="choices">${ideas.map((p,i)=>btn(`${p[0]} · ${p[1]} créditos ${s.ideas.includes(i)?'✓':''}`,`toggle('ideas',${i})`,s.ideas.includes(i)?'selected':'')).join('')}</div><p>Presupuesto utilizado: ${cost()}/100. ${cost()>100?'Excede el presupuesto.':s.ideas.includes(5)?'Advertencia: la biometría obligatoria introduce riesgos de privacidad y exclusión.':''}</p><div class="actions">${btn('Construir prototipo →','move(3)','primary',s.ideas.length<2||cost()>100)}</div>`}if(s.step===3){h+=`<p>Activa las funciones de tu prototipo. El diseño se actualiza en tiempo real.</p><div class="choices">${s.ideas.map(i=>btn(ideas[i][0]+(s.features.includes(i)?' ✓':''),`toggle('features',${i})`,s.features.includes(i)?'selected':'')).join('')}</div><div class="phone"><b>Hospital 360 · Turnos</b>${s.features.map(i=>`<p>${['🔊 Turno A-023 · Consultorio 2','🧭 Orientación: siga la línea azul','📱 Consulte su turno desde el celular','🟢 Modo local disponible','👩‍⚕️ Personal preparado para orientar','🔒 Identificación biométrica (riesgo)'][i]}</p>`).join('')||'<p>Prototipo vacío</p>'}</div><label>Hipótesis de mejora (opcional)</label><textarea id="note" oninput="s.note=this.value" placeholder="Creemos que...">${esc(s.note)}</textarea><div class="actions">${btn('Probar con pacientes →','move(4)','primary',!s.features.length)}</div>`}if(s.step===4){h+=`<p>Realiza una prueba simulada con los cuatro perfiles. Los resultados dependen de tus decisiones.</p>${!s.tested?btn('Ejecutar prueba de usuarios','test()','primary'):''}`;if(s.tested){let f=s.features;h+=people.map((p,i)=>`<div class="feedback"><b>${p[1]}</b><p>${[f.includes(0)?'Ahora puedo escuchar mi turno.':'Sigo sin escuchar mi turno.',f.includes(1)?'Puedo orientarme con ayuda.':'Sigo sin saber dónde ir.',f.includes(4)?'La capacitación ayuda al equipo.':'Necesitamos capacitación para adoptar la solución.',f.includes(3)?'El modo local ayuda cuando falla la red.':'Una caída de red podría detener el sistema.'][i]}</p></div>`).join('');if(f.includes(5))h+='<div class="feedback">La biometría obligatoria requiere reconsideración por privacidad y accesibilidad.</div>';h+=`<h3>Resultados por ciclo</h3>${s.history.map(r=>`<p>Ciclo ${r.round}: ${r.score}/100 · cobertura ${r.access}% · ${r.cost} créditos</p>`).join('')}<p>¿Qué debes mejorar? Regresa a cualquier fase y vuelve a probar.</p><div class="actions">${stages.slice(0,4).map((x,i)=>btn('Revisar '+x,`iterate(${i})`)).join('')}${btn('Descargar informe','report()','primary')}</div>`}}document.getElementById('game').innerHTML=h;let m=metrics();document.getElementById('stats').innerHTML='<h3>Indicadores de diseño</h3>'+['Empatía','Definición','Exploración de ideas','Cobertura de necesidades','Viabilidad presupuestaria'].map((x,i)=>`<small>${x} · ${m[i]}%</small><div class="meter"><i style="width:${m[i]}%"></i></div>`).join('')+'<small>Puntuaciones didácticas, no métricas clínicas reales.</small>';document.getElementById('log').innerHTML=s.log.slice(0,8).map(x=>`<p>• ${esc(x)}</p>`).join('')||'<small>Comienza entrevistando a los pacientes.</small>'}function report(){let t='HOSPITAL 360 — INFORME DE SIMULACIÓN\n'+s.history.map(r=>`Ciclo ${r.round}: ${r.score}/100, cobertura ${r.access}%, presupuesto ${r.cost}`).join('\n')+'\nProblema: '+problems[s.problem]+'\nPrototipo: '+s.features.map(i=>ideas[i][0]).join(', ')+'\nHipótesis: '+s.note+'\nBitácora:\n'+s.log.join('\n')+'\nResultados simulados, no evidencia clínica.';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='Hospital360-informe.txt';a.click();URL.revokeObjectURL(a.href)}reset();</script></html>
